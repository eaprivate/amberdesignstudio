    <!-- JavaScript for Sliding Controls, Mobile Navigation, & Wheel Scrolling -->
    <script>
        // Toggle Mobile Menu Visibility
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        if (mobileMenuBtn && mobileMenu) {
            mobileMenuBtn.addEventListener('click', () => {
                mobileMenu.classList.toggle('hidden');
            });
        }

        function scrollContainer(containerId, distance) {
            const container = document.getElementById(containerId);
            if (container) {
                container.scrollBy({ left: distance, behavior: 'smooth' });
            }
        }

        // Enable horizontal scrolling with the mouse wheel over scroll containers
        document.querySelectorAll('.overflow-x-auto').forEach(container => {
            container.addEventListener('wheel', (evt) => {
                if (evt.deltaY !== 0) {
                    evt.preventDefault();
                    container.scrollLeft += evt.deltaY;
                }
            }, { passive: false });
        });
    </script>
