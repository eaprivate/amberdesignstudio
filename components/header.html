<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amber Design Studio | Creative Studio</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome for social & UI icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar and sleek interactions */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #18181b;
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #52525b;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        darkBg: '#18181b',
                        cardBg: '#27272a',
                    }
                }
            }
        }
    </script>
</head>
<body id="home" class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Global Header -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-slate-950/80 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <!-- Logo -->
                <a href="#home" class="flex-shrink-0 flex items-center space-x-3 text-white font-bold text-xl tracking-tight no-underline">
                    <img src="images/amber_icon2.jpg" alt="Amber Design Studio" class="w-10 h-10 rounded-full object-cover block shadow-lg shadow-indigo-500/30">
                    <span>Amber Design Studio</span>
                </a>

                <!-- Desktop Navigation -->
                <nav class="hidden md:flex items-center space-x-8">
                    <a href="index.html" class="text-sm font-medium text-slate-300 hover:text-white transition-colors">Home</a>
                    <a href="index.html#services" class="text-sm font-medium text-slate-300 hover:text-white transition-colors">Services</a>

                    <!-- Works Dropdown Menu -->
                    <div class="relative group" id="works-dropdown-container">
                        <button id="works-btn" class="flex items-center space-x-1 text-sm font-medium text-slate-300 hover:text-white py-2 focus:outline-none transition-colors">
                            <span>Works</span>
                            <svg class="w-4 h-4 transition-transform duration-200 group-hover:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                            </svg>
                        </button>

                        <!-- Sliding/Fading Dropdown Menu -->
                        <div id="works-menu" class="absolute top-full left-0 w-64 pt-2 opacity-0 translate-y-2 pointer-events-none group-hover:opacity-100 group-hover:translate-y-0 group-hover:pointer-events-auto transition-all duration-200 ease-out">
                            <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-2 backdrop-blur-xl">
                                <a href="works.html#watchfaces" class="flex items-center space-x-3 p-3 rounded-xl hover:bg-slate-800/80 transition-colors group/item">
                                    <div class="w-9 h-9 rounded-lg bg-sky-500/10 flex items-center justify-center text-sky-400 group-hover/item:bg-sky-500 group-hover/item:text-white transition-colors">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                    </div>
                                    <div>
                                        <div class="text-sm font-semibold text-white">Wear OS Watch Faces</div>
                                        <div class="text-xs text-slate-400">Custom smartwatch interfaces</div>
                                    </div>
                                </a>

                                <a href="works.html#apps" class="flex items-center space-x-3 p-3 rounded-xl hover:bg-slate-800/80 transition-colors group/item mt-1">
                                    <div class="w-9 h-9 rounded-lg bg-indigo-500/10 flex items-center justify-center text-indigo-400 group-hover/item:bg-indigo-500 group-hover/item:text-white transition-colors">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                                    </div>
                                    <div>
                                        <div class="text-sm font-semibold text-white">Apps</div>
                                        <div class="text-xs text-slate-400">Android mobile solutions</div>
                                    </div>
                                </a>

                                <a href="works.html#games" class="flex items-center space-x-3 p-3 rounded-xl hover:bg-slate-800/80 transition-colors group/item mt-1">
                                    <div class="w-9 h-9 rounded-lg bg-violet-500/10 flex items-center justify-center text-violet-400 group-hover/item:bg-violet-500 group-hover/item:text-white transition-colors">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                    </div>
                                    <div>
                                        <div class="text-sm font-semibold text-white">Games</div>
                                        <div class="text-xs text-slate-400">Arcade & action gaming</div>
                                    </div>
                                </a>
                            </div>
                        </div>
                    </div>

                    <a href="index.html#about" class="text-sm font-medium text-slate-300 hover:text-white transition-colors">About</a>
                    <a href="index.html#contact" class="text-sm font-medium text-slate-300 hover:text-white transition-colors">Contact</a>
                </nav>

                <!-- CTA Button -->
                <div class="hidden md:block">
                    <a href="index.html#contact" class="px-5 py-2.5 rounded-full bg-gradient-to-r from-indigo-500 to-violet-600 text-white font-medium text-sm shadow-lg shadow-indigo-500/25 hover:shadow-indigo-500/40 transition-all transform hover:-translate-y-0.5">
                        Get Started
                    </a>
                </div>

                <!-- Mobile Menu Button -->
                <div class="md:hidden flex items-center">
                    <button id="mobile-menu-btn" class="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-900 focus:outline-none">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Navigation Drawer -->
        <div id="mobile-menu" class="hidden md:hidden bg-slate-950 border-b border-slate-800 px-4 pt-2 pb-6 space-y-2">
            <a href="#home" class="block px-3 py-2 rounded-lg text-base font-medium text-slate-300 hover:bg-slate-900 hover:text-white">Home</a>
            <a href="#services" class="block px-3 py-2 rounded-lg text-base font-medium text-slate-300 hover:bg-slate-900 hover:text-white">Services</a>
            <div class="px-3 py-2 font-medium text-indigo-400 text-sm">Works Menu:</div>
            <a href="works.html#watchfaces" class="block pl-6 pr-3 py-1.5 rounded-lg text-sm text-slate-400 hover:text-white">↳ Wear OS Watch Faces</a>
            <a href="works.html#apps" class="block pl-6 pr-3 py-1.5 rounded-lg text-sm text-slate-400 hover:text-white">↳ Apps</a>
            <a href="works.html#games" class="block pl-6 pr-3 py-1.5 rounded-lg text-sm text-slate-400 hover:text-white">↳ Games</a>
            <a href="#about" class="block px-3 py-2 rounded-lg text-base font-medium text-slate-300 hover:bg-slate-900 hover:text-white">About</a>
            <a href="#contact" class="block px-3 py-2 rounded-lg text-base font-medium text-slate-300 hover:bg-slate-900 hover:text-white">Contact</a>
        </div>
    </header>
